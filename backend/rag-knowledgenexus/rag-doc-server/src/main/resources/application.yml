spring:
  profiles:
    active: dev
  jackson:
    generator:
      write_numbers_as_strings: true
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://mysql-prod:3306/rag_knowledge_base?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowMultiQueries=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    generator:
      write_numbers_as_strings: true

rag:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}

logging:
  level:
    root: WARN
    com.rag.system: INFO
  file:
    name: /var/log/rag-system/app.log
    max-size: 100MB
    max-history: 30