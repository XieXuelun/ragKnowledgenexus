# =====================================================================
# 开发环境配置示例
# 复制为 application-dev.yml 后填入本地实际值；application-dev.yml 已被 .gitignore 忽略
# =====================================================================

spring:
  application:
    name: rag-knowledge-base
    description: 企业智能文档问答助手
  config:
    activate:
      on-profile: dev

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/rag_knowledge_base?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowMultiQueries=true
    username: root
    password: <mysql-password>
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # 当前代码未使用 Redis，保留配置仅为兼容依赖
  redis:
    host: 127.0.0.1
    port: 6379
    password: <redis-password>
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 5000ms

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

rag:
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: <minio-access-key>
    secret-key: <minio-secret-key>
    bucket:
      document: rag-documents
      avatar: user-avatar
    region: us-east-1

  embedding:
    provider: aliyun
    model: text-embedding-v3
    api-key: <dashscope-api-key>
    api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings

  chat:
    provider: aliyun
    model: qwen-plus
    api-key: <dashscope-api-key>
    api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions

  qdrant:
    host: 127.0.0.1
    port: 6334
    http-port: 6333
    use-tls: false
    dimension: 1024

logging:
  level:
    root: INFO
    com.rag.system: DEBUG
    org.springframework: INFO
    org.mybatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/rag-system.log
    max-size: 10MB
    max-history: 30

server:
  port: 8085
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: always
    include-stacktrace: on_param
